
name: CI de Titanium Mobile

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lockfile:
    name: Consistencia del lockfile con EAS y CI
    uses: ./.github/workflows/dependency-install.yml

  analisis-estatico:
    name: Análisis estático (ESLint y TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        id: dependencias
        run: npm ci

      - name: Generar tipos de Expo Router
        id: rutas
        if: ${{ steps.dependencias.outcome == 'success' }}
        run: |
          set -o pipefail
          npx expo customize tsconfig.json 2>&1 | tee expo-routes.log

      - name: Comprobar TypeScript
        id: typescript
        if: ${{ steps.rutas.outcome == 'success' }}
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee typescript.log

      - name: Ejecutar ESLint
        id: eslint
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee eslint.log

      - name: Publicar resultados del análisis estático en texto
        if: always()
        env:
          TYPESCRIPT_RESULT: ${{ steps.typescript.outcome }}
          ESLINT_RESULT: ${{ steps.eslint.outcome }}
          DEPS_RESULT: ${{ steps.dependencias.outcome }}
          ROUTES_RESULT: ${{ steps.rutas.outcome }}
        run: |
          node scripts/ci-summary.cjs static
          {
            echo '### Generación de rutas Expo Router'
            echo "- Resultado: **$ROUTES_RESULT**"
            if [ "$ROUTES_RESULT" = 'failure' ] && [ -f expo-routes.log ]; then
              echo '```text'
              tail -n 50 expo-routes.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pruebas-unitarias:
    name: Pruebas unitarias (Jest y RNTL)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        id: tests
        run: |
          set -o pipefail
          npm run test:unit -- --ci --runInBand --coverage \
            --coverageDirectory=coverage/unitarias \
            --coverageReporters=text --coverageReporters=json-summary \
            --json --outputFile=jest-unitarias.json 2>&1 | tee unitarias.log

      - name: Publicar resultados unitarios en texto
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: node scripts/ci-summary.cjs jest "Pruebas unitarias" jest-unitarias.json coverage/unitarias/coverage-summary.json unitarias.log

  pruebas-integracion:
    name: Pruebas de integración (Jest y RNTL)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas de integración
        id: tests
        run: |
          set -o pipefail
          npm run test:integration -- --ci --runInBand --coverage \
            --coverageDirectory=coverage/integracion \
            --coverageReporters=text --coverageReporters=json-summary \
            --json --outputFile=jest-integracion.json 2>&1 | tee integracion.log

      - name: Publicar resultados de integración en texto
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: node scripts/ci-summary.cjs jest "Pruebas de integración" jest-integracion.json coverage/integracion/coverage-summary.json integracion.log

  pruebas-aceptacion:
    name: Pruebas de aceptación simuladas (Jest y RNTL)
    needs: [analisis-estatico, pruebas-unitarias, pruebas-integracion]
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: |
          set -o pipefail
          npm ci 2>&1 | tee aceptacion-instalacion.log

      - name: Ejecutar pruebas de aceptación
        id: tests
        run: |
          set -o pipefail
          npm run test:acceptance -- --ci --runInBand --coverage \
            --coverageDirectory=coverage/aceptacion \
            --coverageReporters=text --coverageReporters=json-summary --coverageReporters=html \
            --json --outputFile=jest-aceptacion.json 2>&1 | tee aceptacion.log

      - name: Publicar resultados de aceptación en texto
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: node scripts/ci-summary.cjs jest "Pruebas de aceptación simuladas (sin APK)" jest-aceptacion.json coverage/aceptacion/coverage-summary.json aceptacion.log

      - name: Guardar evidencias de aceptación incluso ante fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-aceptacion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            jest-aceptacion.json
            aceptacion.log
            aceptacion-instalacion.log
            coverage/aceptacion/
          if-no-files-found: warn
          retention-days: 14

  pruebas-regresion:
    name: Pruebas de regresión (suite completa)
    needs: [analisis-estatico, pruebas-unitarias, pruebas-integracion]
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar todas las pruebas existentes
        id: tests
        run: |
          set -o pipefail
          npm test -- --ci --runInBand --coverage \
            --collectCoverageFrom='src/**/*.{ts,tsx}' \
            --coverageDirectory=coverage/regresion \
            --coverageReporters=text --coverageReporters=json-summary --coverageReporters=lcov \
            --json --outputFile=jest-regresion.json 2>&1 | tee regresion.log

      - name: Publicar resultados de regresión en texto
        if: always()
        env:
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: node scripts/ci-summary.cjs jest "Pruebas de regresión" jest-regresion.json coverage/regresion/coverage-summary.json regresion.log

      - name: Guardar cobertura LCOV para SonarQube
        if: ${{ steps.tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-sonarqube
          path: coverage/regresion/lcov.info
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------
  # SONARQUBE CLOUD - ANALISIS DE SEGURIDAD Y CALIDAD
  # ---------------------------------------------------------
  sonarqube:
    name: Seguridad y calidad (SonarQube Cloud)

    needs: [analisis-estatico, pruebas-regresion]

    # Evitar analizar push de ramas feature/* en el plan Free.
    # Analizar develop y Pull Requests dirigidos a develop.
    # Los PR externos no reciben secretos por seguridad.
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'pull_request' &&
         github.base_ref == 'develop' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obtener código completo del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar cobertura de regresión
        uses: actions/download-artifact@v4
        with:
          name: cobertura-sonarqube
          path: coverage

      - name: Comprobar archivo de cobertura
        run: test -s coverage/lcov.info

      - name: Ejecutar análisis SonarQube y comprobar Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  pruebas-rendimiento:
    name: Pruebas de rendimiento (Reassure)
    if: ${{ github.event_name == 'pull_request' }}
    needs: [pruebas-regresion]
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Medir línea base del commit destino con los mismos escenarios
        id: linea-base
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASELINE_DIR="$(mktemp -d "$RUNNER_TEMP/reassure-base.XXXXXX")"
          git worktree add --detach "$BASELINE_DIR" "$BASE_SHA"
          trap 'git worktree remove --force "$BASELINE_DIR"' EXIT
          node -e 'const p = require(process.argv[1]); if (!p.devDependencies?.reassure) throw new Error("La rama destino no contiene Reassure; no se permite sustituirla por develop");' "$BASELINE_DIR/package.json"

          # Mantener las pruebas adicionales del destino y usar el mismo escenario
          # y las mismas aserciones del PR en ambos lados de la comparación.
          mkdir -p "$BASELINE_DIR/tests/performance" .reassure
          cp -R tests/performance/. "$BASELINE_DIR/tests/performance/"
          echo "Generando línea base desde $BASE_BRANCH ($BASE_SHA)"
          (
            cd "$BASELINE_DIR"
            npm ci
            npx --no-install reassure --baseline --branch "$BASE_BRANCH" --commit-hash "$BASE_SHA" -- --ci --json --outputFile=.reassure/jest-baseline.json
          )
          cp "$BASELINE_DIR/.reassure/baseline.perf" .reassure/baseline.perf
          cp "$BASELINE_DIR/.reassure/jest-baseline.json" .reassure/jest-baseline.json

      - name: Instalar dependencias
        run: npm ci

      - name: Medir rama actual y comparar
        id: comparar
        env:
          REASSURE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          export REASSURE_CURRENT_SHA="$(git rev-parse HEAD)"
          npx --no-install reassure --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --commit-hash "$REASSURE_CURRENT_SHA" -- --ci --json --outputFile=.reassure/jest-current.json
          node scripts/verify-reassure.cjs

      - name: Guardar mediciones y resultados de rendimiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendimiento-reassure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .reassure/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Publicar resultados de rendimiento en texto
        if: always()
        env:
          BASELINE_RESULT: ${{ steps.linea-base.outcome }}
          COMPARE_RESULT: ${{ steps.comparar.outcome }}
        run: |
          {
            echo '## Pruebas de rendimiento (Reassure)'
            echo "- Línea base: **$BASELINE_RESULT**"
            echo "- Comparación: **$COMPARE_RESULT**"
            echo ''
            if [ -f .reassure/output.md ]; then
              cat .reassure/output.md
            else
              echo 'No hay informe de comparación disponible. Revisa los logs del trabajo; no se considera una prueba aprobada sin resultados.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
