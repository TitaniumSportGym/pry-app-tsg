name: CI de Titanium Mobile

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

jobs:
  analisis-estatico:
    name: Análisis estático (ESLint y TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar ESLint
        run: npm run lint

  pruebas-unitarias:
    name: Pruebas unitarias (Jest y RNTL)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit -- --ci --runInBand

  pruebas-integracion:
    name: Pruebas de integración (Jest y RNTL)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas de integración
        run: npm run test:integration -- --ci --runInBand

  pruebas-regresion:
    name: Pruebas de regresión (suite completa)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar todas las pruebas existentes
        run: npm test -- --ci --runInBand

  pruebas-rendimiento:
    name: Pruebas de rendimiento (Reassure)
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Medir línea base de la rama destino
        run: |
          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          CURRENT_SHA="$(git rev-parse HEAD)"
          git switch --detach "origin/$BASE_BRANCH"
          if grep -q '"reassure"' package.json; then
            npm ci
            npx reassure --baseline || echo "::warning::No se pudo medir la línea base de $BASE_BRANCH."
          else
            echo "::notice::$BASE_BRANCH todavía no tiene Reassure; se omite la comparación."
          fi
          git switch --detach "$CURRENT_SHA"

      - name: Instalar dependencias
        run: npm ci

      - name: Medir rama actual y comparar
        run: npx reassure --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

      - name: Publicar resultados
        if: always()
        run: |
          if [ -f .reassure/output.md ]; then
            cat .reassure/output.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sin línea base para comparar; las mediciones actuales quedaron registradas en el log." >> "$GITHUB_STEP_SUMMARY"
          fi
