name: Instalación reproducible con npm de EAS y CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    name: Node ${{ matrix.node }} / npm ${{ matrix.npm }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Toolchain observed in the failed SDK 58 Android build.
          - node: '22.23.2'
            npm: '10.9.9'
          # Toolchain observed in the successful PR #95 workflow.
          - node: '24.22.2'
            npm: '11.19.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Seleccionar la versión exacta de npm
        run: npm install --global "npm@${{ matrix.npm }}"
      - name: Registrar Node y npm reales
        run: |
          node --version
          npm --version
      - name: Instalar exactamente como EAS
        run: npm ci --include=dev
      - name: Comprobar que la instalación no reescribe los manifiestos
        run: git diff --exit-code -- package.json package-lock.json
      - name: Validar todas las resoluciones transitivas afectadas
        run: npm ls minimatch glob test-exclude --all
      - name: Verificar seguridad y contratos de las dependencias instaladas
        run: npm test -- --ci --runInBand --watchman=false --runTestsByPath tests/security/dependency-security.test.ts
